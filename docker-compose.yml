# Déploiement Dokploy (type "Docker Compose"). Les images sont construites par GitHub Actions
# (.github/workflows/deploy.yml) et publiées sur ghcr.io : le serveur ne compile plus rien.
# En local, pour construire soi-même : docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Variables à définir dans l'onglet Environment de Dokploy (ou un fichier .env) :
#   DATABASE_URL=postgresql://user:password@host:5432/rdv
#   AUTH_SECRET=<openssl rand -base64 32>
#   AUTH_URL=https://ton-domaine.fr        (optionnel, recommandé)
#   RESEND_API_KEY=re_...                  (emails ; sans elle, aucun email ne part)
#   EMAIL_FROM="Reservy <rdv@ton-domaine.fr>"
#   CRON_SECRET=<openssl rand -hex 32>     (rappels J-1)
#   AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET     (connexion Google, facultatif)
#   AUTH_DISCORD_ID / AUTH_DISCORD_SECRET   (connexion Discord, facultatif)
services:
  migrate:
    image: ${RDV_IMAGE:-ghcr.io/jules-crevoisier/rdv}-migrate:${RDV_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant}
    restart: "no"

  app:
    image: ${RDV_IMAGE:-ghcr.io/jules-crevoisier/rdv}:${RDV_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant}
      AUTH_URL: ${AUTH_URL:-}
      APP_URL: ${APP_URL:-}
      APP_NAME: ${APP_NAME:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      TZ: ${APP_TIMEZONE:-Europe/Paris}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      CRON_SECRET: ${CRON_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"
