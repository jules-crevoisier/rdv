# Construit les images Docker sur GitHub (le serveur Dokploy n'a pas assez de mémoire pour compiler Next.js),
# les publie sur ghcr.io, puis demande à Dokploy de redéployer : il ne fait plus que télécharger les images.
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   DOKPLOY_URL         ex. https://srko.fr
#   DOKPLOY_API_KEY     Dokploy > Settings > Profile > API/CLI > Generate
#   DOKPLOY_COMPOSE_ID  id du compose rdv-app (dans l'URL de sa page Dokploy)
name: Build et déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom des images
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}-migrate:latest
            ${{ env.IMAGE }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Image app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redéployer sur Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::warning::Secrets Dokploy absents : images publiées, déploiement à lancer depuis Dokploy."
            exit 0
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
